version: "2"

# Baseline for golangci-lint v2.15. It was introduced on a tree that had never
# been linted, so it gates new code without forcing a sweep through internal/
# and cmd/. Remaining work is listed in README.md under "Lint baseline".
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    # errcheck is off: it reports 399 findings on this tree, mostly unchecked
    # fmt.Fprint*/io.WriteString to CLI writers and deferred Close calls.
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Quick-fix suggestions (De Morgan, tagged switch, Fprintf) are style
        # preferences, not defects.
        - -QF*
  exclusions:
    # Findings that existed when the baseline was set. Each rule is pinned to
    # one file and one message so the same problem elsewhere still fails.
    # Delete a rule when its finding is fixed.
    rules:
      - path: internal/hooks/(command|go_check)\.go
        linters: [staticcheck]
        text: "SA1019: runtime.GOROOT has been deprecated"
      - path: internal/agent/resume\.go
        linters: [staticcheck]
        text: "SA4017: sideEffect doesn't have side effects"
      - path: internal/transport/server_test\.go
        linters: [staticcheck]
        text: "SA9003: empty branch"
      - path: internal/agent/m2_test\.go
        linters: [staticcheck]
        text: "S10(00|37): should use"
      - path: internal/eval/m3\.go
        linters: [staticcheck]
        text: "ST1023: should omit type provider.Provider"
      - path: internal/agent/child\.go
        linters: [ineffassign]
        text: "ineffectual assignment to runErr"
      - path: internal/agent/loop\.go
        linters: [unused]
        text: "func \\(\\*Manager\\)\\.loop is unused"
      - path: internal/program/isolate_linux\.go
        linters: [unused]
        text: "var cpuSink is unused"
      - path: internal/tools/local\.go
        linters: [unused]
        text: "func commandResources is unused"
