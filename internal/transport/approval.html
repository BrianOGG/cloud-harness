<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run approvals · Cloud Harness</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f6f8;
      --panel: #fff;
      --text: #192331;
      --muted: #455466;
      --border: #a5b0bc;
      --accent: #075674;
      --button-text: #fff;
      --error: #a32626;
      font: 100%/1.5 system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #131a22;
        --panel: #1d2733;
        --text: #f0f4f8;
        --muted: #becad6;
        --border: #708091;
        --accent: #91d6ee;
        --button-text: #15252c;
        --error: #ffb4af;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--background); color: var(--text); }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { margin-bottom: 1rem; }
    h1 { margin: 0; font-size: 1.75rem; }
    h2 { margin: 0 0 .5rem; font-size: 1.25rem; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    header a { display: inline-flex; align-items: center; min-height: 44px; }
    .panel, #queue a {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: .6rem;
      background: var(--panel);
    }
    #queue ul { padding: 0; margin: 0; list-style: none; }
    #queue li + li { margin-top: .75rem; }
    #queue a { display: block; color: var(--text); text-decoration: none; }
    #queue a:hover strong { text-decoration: underline; }
    #queue strong { display: block; }
    #queue small, .muted { color: var(--muted); }
    .message, #queue strong { white-space: pre-wrap; overflow-wrap: anywhere; }
    .run-id, #detail-text[data-command] { font-family: ui-monospace, monospace; }
    .run-id { margin: 0 0 .75rem; overflow-wrap: anywhere; }
    #error { color: var(--error); }
    #warnings { padding: .75rem; border: 2px solid var(--error); border-radius: .4rem; color: var(--error); font-weight: 600; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input, textarea, button { font: inherit; }
    input, textarea {
      width: 100%;
      min-height: 44px;
      margin-bottom: .75rem;
      padding: .5rem .65rem;
      color: var(--text);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: .35rem;
    }
    textarea { display: block; resize: vertical; }
    button {
      min-height: 44px;
      padding: .5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: .35rem;
      background: var(--accent);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    #deny { background: var(--panel); color: var(--error); border-color: var(--border); }
    #token-form button, #answer-form button { width: 100%; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Run approvals</h1>
      <a id="back" href="?" hidden>All approvals</a>
    </header>
    <noscript>JavaScript is required to load approvals and submit responses.</noscript>
    <p id="loading" role="status" hidden>Loading…</p>
    <p id="error" class="message" role="alert" hidden></p>
    <form id="token-form" class="panel" autocomplete="off" hidden>
      <h2>Enter your HTTP token to continue</h2>
      <p class="muted">Paste the token configured for this server. This browser will remember it.</p>
      <label for="token">HTTP token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button type="submit">Save token</button>
    </form>
    <section id="queue" aria-label="Waiting runs" hidden>
      <p id="empty" hidden>No runs are waiting for your approval or answer.</p>
      <ul id="items"></ul>
    </section>
    <section id="detail" class="panel" aria-labelledby="run-status" hidden>
      <p id="run-id" class="run-id muted"></p>
      <h2 id="run-status" role="status"></h2>
      <p id="wait-time" class="muted" hidden></p>
      <p id="warnings" class="message" role="alert" hidden></p>
      <p id="detail-text" class="message" hidden></p>
      <div id="decisions" class="actions" hidden>
        <button id="deny" type="button">Deny</button>
        <button id="approve" type="button">Approve</button>
      </div>
      <form id="answer-form" hidden>
        <label for="answer">Your answer</label>
        <textarea id="answer" rows="3" required></textarea>
        <button id="send-answer" type="submit">Send answer</button>
      </form>
      <p id="submitting" role="status" hidden>Submitting…</p>
      <p id="connection" class="message muted" role="status" hidden></p>
    </section>
  </main>
  <script>
    const element = id => document.getElementById(id);
    const tokenKey = "cloud-harness.http-token";
    const runID = new URLSearchParams(location.search).get("run");
    const runPath = runID === null ? "" : "/v1/runs/" + encodeURIComponent(runID);
    const requests = new AbortController();
    const terminal = new Set(["COMPLETED", "FAILED", "CANCELLED"]);
    const transitions = new Set(["run.resumed", "run.WAITING", "run.completed", "run.FAILED", "run.cancelled"]);
    const waitLabels = { approval: "Waiting for approval", ask_user: "Waiting for your answer" };
    let currentRun;
    let submitting = false;
    let lastEventID = "";

    async function request(path, options = {}) {
      const token = localStorage.getItem(tokenKey);
      if (!token) throw Object.assign(new Error(), { status: 401 });
      const headers = new Headers(options.headers);
      headers.set("Authorization", "Bearer " + token);
      // Relative to the page, including when both routes are behind a proxy prefix.
      const response = await fetch("." + path, {
        ...options, headers, signal: requests.signal,
        cache: "no-store", credentials: "omit", redirect: "error",
      });
      if (!response.ok) {
        const body = await response.text();
        throw Object.assign(new Error(`HTTP ${response.status}\n${body}`), { status: response.status });
      }
      return response;
    }

    async function json(path, options) {
      return (await request(path, options)).json();
    }

    function showText(id, text) {
      const node = element(id);
      node.textContent = text;
      node.hidden = !text;
    }

    function showError(error) {
      if (requests.signal.aborted) return;
      if (error.status === 401) {
        requests.abort();
        element("queue").hidden = true;
        element("detail").hidden = true;
        element("token-form").hidden = false;
      }
      showText("error", error.message);
    }

    element("token-form").addEventListener("submit", event => {
      event.preventDefault();
      const input = element("token");
      const token = input.value.trim();
      if (!token) return;
      try {
        localStorage.setItem(tokenKey, token);
        input.value = "";
        location.reload();
      } catch (error) {
        showText("error", error.message);
      }
    });

    function waitTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      if (hours) return `${hours}h ${minutes % 60}m`;
      if (minutes) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    }

    const readQueue = () => json("/v1/approvals");

    async function loadQueue() {
      const queue = await readQueue();
      for (const item of queue) {
        const row = document.createElement("li");
        const link = document.createElement("a");
        const title = document.createElement("strong");
        const detail = document.createElement("small");
        link.href = "?" + new URLSearchParams({ run: item.run_id });
        title.textContent = item.summary || item.run_id;
        detail.textContent = `${waitLabels[item.wait_reason]} · ${waitTime(item.waiting_seconds)}`;
        link.append(title, detail);
        row.append(link);
        element("items").append(row);
      }
      element("empty").hidden = queue.length > 0;
      element("queue").hidden = false;
    }

    async function showRun(run) {
      // A GET started by the stream may finish after a submission returns.
      if (requests.signal.aborted || run.version < currentRun?.version) return;
      if (run.version !== currentRun?.version) {
        element("answer").value = "";
        showText("wait-time", "");
      }
      currentRun = run;
      const waiting = run.status === "WAITING";
      const approval = waiting && run.wait_reason === "APPROVAL";
      const question = waiting && run.wait_reason === "USER";
      const invocation = run.pending_invocation;
      const command = invocation?.arguments?.command;
      let summary = run.error?.message || run.final_answer || "";
      if (approval && invocation) summary = command || `${invocation.tool} ${invocation.args_summary}`;
      if (approval && command && invocation.arguments.cwd) summary += `\n\nWorking directory: ${invocation.arguments.cwd}`;
      if (question) summary = run.question || "";

      const statuses = { RUNNING: "Running…", COMPLETED: "Completed", FAILED: "Failed", CANCELLED: "Cancelled" };
      const kind = approval ? "approval" : "ask_user";
      const status = approval || question ? waitLabels[kind] : statuses[run.status] || `Waiting: ${run.wait_reason}`;
      element("run-status").textContent = status;
      element("run-id").textContent = run.id;
      element("detail-text").toggleAttribute("data-command", approval);
      showText("warnings", approval ? (invocation?.warnings || []).join("\n\n") : "");
      showText("detail-text", summary);
      element("decisions").hidden = !approval;
      element("answer-form").hidden = !question;
      element("detail").hidden = false;

      if (approval || question) {
        const queue = await readQueue();
        if (requests.signal.aborted || currentRun !== run) return;
        const item = queue.find(item => item.run_id === run.id && item.wait_reason === kind);
        showText("wait-time", item ? `Waiting for ${waitTime(item.waiting_seconds)}` : "");
        if (!summary && item) showText("detail-text", item.summary);
      }
    }

    async function refreshRun() {
      await showRun(await json(runPath));
    }

    async function readEvents() {
      const headers = { Accept: "text/event-stream" };
      if (lastEventID) headers["Last-Event-ID"] = lastEventID;
      const response = await request(runPath + "/events", { headers });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let pending = "";
      showText("connection", "");
      try {
        while (!terminal.has(currentRun.status)) {
          const { value, done } = await reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          const frames = pending.split(/\r?\n\r?\n/);
          pending = frames.pop();
          let cursor = lastEventID;
          let changed = false;
          for (const frame of frames) {
            for (const line of frame.split(/\r?\n/)) {
              if (line.startsWith("id:")) cursor = line.slice(3).trim();
              if (line.startsWith("event:") && transitions.has(line.slice(6).trim())) changed = true;
            }
          }
          if (changed) await refreshRun();
          lastEventID = cursor;
        }
      } finally {
        await reader.cancel().catch(() => {});
      }
    }

    async function watchRun() {
      while (!requests.signal.aborted && !terminal.has(currentRun.status)) {
        try {
          await readEvents();
          // The server closes the stream at terminal status. Check once on EOF
          // in case the connection closed before its last event reached us.
          if (!terminal.has(currentRun.status)) await refreshRun();
        } catch (error) {
          if (requests.signal.aborted) return;
          if (error.status === 401) {
            showError(error);
            return;
          }
          showText("connection", `Live updates interrupted. Reconnecting…\n${error.message}`);
        }
        if (!terminal.has(currentRun.status)) await new Promise(resolve => setTimeout(resolve, 1000));
      }
      showText("connection", "");
    }

    function setSubmitting(active) {
      submitting = active;
      for (const id of ["approve", "deny", "answer", "send-answer"]) element(id).disabled = active;
      element("submitting").hidden = !active;
    }

    async function submit(reason, endpoint, payload) {
      if (submitting || requests.signal.aborted || currentRun?.status !== "WAITING" || currentRun.wait_reason !== reason) return;
      setSubmitting(true);
      showText("error", "");
      try {
        const run = await json(runPath + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        await showRun(run);
      } catch (error) {
        showError(error);
      } finally {
        setSubmitting(false);
      }
    }

    for (const decision of ["approve", "deny"]) {
      element(decision).addEventListener("click", () => submit("APPROVAL", "/responses", { decision }));
    }
    element("answer-form").addEventListener("submit", event => {
      event.preventDefault();
      const answer = element("answer").value;
      if (answer.trim()) submit("USER", "/answer", { answer });
      else showText("error", "Enter an answer.");
    });

    async function load() {
      element("loading").hidden = false;
      try {
        if (runID === null) {
          await loadQueue();
          return;
        }
        element("back").hidden = false;
        if (!runID || runID === "." || runID === "..") throw new Error("Invalid run ID.");
        await refreshRun();
      } catch (error) {
        showError(error);
      } finally {
        element("loading").hidden = true;
      }
      if (currentRun && !requests.signal.aborted) void watchRun();
    }

    void load();
  </script>
</body>
</html>
